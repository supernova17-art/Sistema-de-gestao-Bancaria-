<g class="label"><text x="317" y="178" text-anchor="middle">1. Introduz operação e montante</text><text x="640" y="263" text-anchor="middle">2. Valida entradas e regras</text><text x="990" y="343" text-anchor="middle">3. Inicia transação e atualiza saldo(s)</text><text x="990" y="423" text-anchor="middle">4. Regista operação</text><text x="990" y="503" text-anchor="middle">5. Cria alerta se necessário</text><text x="990" y="583" text-anchor="middle">6. Confirma transação</text><text x="990" y="620" text-anchor="middle">resultado de commit</text><text x="640" y="654" text-anchor="middle">7. Apresenta sucesso ou erro</text><text x="310" y="694" text-anchor="middle">8. Mostra saldo atualizado</text></g></svg>
