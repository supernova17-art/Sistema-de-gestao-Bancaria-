<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#183e35}.head{fill:#e8f2eb;stroke:#31765f;stroke-width:2}.life{stroke:#9aaea5;stroke-width:2;stroke-dasharray:8 7}.msg{stroke:#38745f;stroke-width:2;fill:none;marker-end:url(#arrow)}.return{stroke:#8b9c95;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrowGray)}.label{font-size:17px}.title{font-size:19px;font-weight:bold}</style>
